<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>图片标签</title>
</head>
<body>
  <!--
    图片标签:
      a.标签名: <img />
      b.属性:
        src:指定需要显示的图片路径
        alt:图片无法显示时的替代文本
        width:设置图片的宽度
        height:设置图片的高度
        title:将鼠标放到图片上出现的文字提示

      c.注意:调整图片,只设置 width 即可,图片会等比例缩放
  -->
  <img src="../image/eg.png" width="300" alt="图片裂开" title="点我" />
</body>
</html>
