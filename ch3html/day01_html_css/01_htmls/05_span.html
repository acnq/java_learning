<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单元格合并</title>
</head>
<body>
  <table border="2" width="500" cellspacing="0" cellpadding="1" align="center">
    <!--设置表名-->
    <caption>成绩表</caption>

    <tr>
      <th>编号</th>
      <th>姓名</th>
      <th>性别</th>
      <th>成绩</th>
    </tr>
    <tr align="center">
      <td>100</td>
      <td>小灰灰</td>
      <td>男</td>
      <td>80</td>
    </tr>
    <tr align="center">
      <td>200</td>
      <td>五大</td>
      <td>男</td>
      <td rowspan="2">90</td>
    </tr>
    <tr align="center">
      <td>300</td>
      <td>红太狼</td>
      <td>女</td>
    </tr>
    <tr align="center">
      <td>总成绩</td>
      <td colspan="3">900</td>
    </tr>
  </table>
</body>
</html>
