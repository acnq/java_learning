<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>超链接标签</title>
</head>
<body>
<!--
  1.<a></a>
  2.a标签属性:
  href:用于确定需要显示页面的路径
  target:确定以何种方式打开href所设置的页面.常用取值: _blank  _self等
  _blank:在新窗口中打开href确定的页面
  _self:默认,在原窗口打开href确定的页面
-->
<a href="http://www.baidu.com" target="_self">跳转到百度</a>
</body>
</html>
