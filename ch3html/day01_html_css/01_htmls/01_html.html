<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常用基本标签</title>
</head>
<body>
<!--
  标题标签：
    <hn></hn>
    n: 1-6, 数字越大，显示越大
-->
<h1>我是标题标签1</h1>
<h2>我是标题标签2</h2>
<h3>我是标题标签3</h3>

<!--
  水平分割线标签：
  <hr />
  属性：
    size: 分割线粗细
    color: 分割线颜色
-->
<hr color="red" size="2" />

<!--
  字体标签：<font></font>
  <font 属性名=属性值 属性名=属性值></font>

  1. 常用属性：
    size(1-7) 设置字体大小
    color     设置字体颜色
  2. color属性：设置字体颜色
    a. 颜色的取值： #xxxxxx 或 颜色英文名字
    b. #xxxxxx 表示使用rgb设置颜色
      - 红绿蓝分别取值：00 -- FF，此处使用16进制。（FF就是十进制的255）
      - #000000 表示黑色，#FFFFFF白色
      - #FF0000红色，#00FF00绿色，#0000FF蓝色
    c.color 使用英文单词确定颜色。red 红色，blue 蓝色，green绿色
-->
<font size="5" color="#5f9ea0">字体标签</font>

<!--
  换行标签:
  <br/>
  注意:换行之后没有行间距
-->
<br />
<font size="5" color="blue">字体标签</font>

<br/>
<hr color="red" size="5" />
<!--
  格式化标签:
    <b></b>  加粗
    <u></u>  下划线
    <i></i>  倾斜

    标签之间可以嵌套
-->
<i><u><b>格式化标签</b></u></i>

<br />
<hr color="red" size="2"/>

<!--
  段落标签:<p>
  注意:p标签自带换行效果,换行之后有行间距
-->

<p>段落1</p>
<p>段落2</p>
<p>段落3</p>
</body>
</html>
