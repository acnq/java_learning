<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>表格标签</title>
</head>
<body>
  <table border="1" width="500" height="300" bgcolor="#5f9ea0" cellspacing="5" cellpadding="2">
    <tr>
      <th>1-1</th>
      <th>1-2</th>
      <th>1-3</th>
    </tr>
    <tr align="center">
      <td>2-1</td>
      <td>2-2</td>
      <td>2-3</td>
    </tr>
    <tr align="center">
      <td>3-1</td>
      <td>3-2</td>
      <td>3-3</td>
    </tr>
  </table>

  <hr size="2" color="red"/>
  <table border="1" width="500" height="300" bgcolor="#5fea0" cellspacing="5" cellpadding="2">
    <!--
      快速生成n行n列快捷键:
      tr*行数>td*列数   ->  tab键
    -->
      <tr>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td></td>
      </tr>
  </table>
</body>
</html>
